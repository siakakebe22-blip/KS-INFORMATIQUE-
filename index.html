<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KS INFORMATIQUE – Complexe Scolaire KS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap">
<style>
:root{--pu:#3F1D8F;--pu2:#5B2DB8;--ye:#FFD21F;--gr:#1E8E3E;--ac:#5B2DB8;--bg:#F3F0FB;--card:#fff;--ink:#1B1433;--mut:#5E5780;--line:#DDD6F0;--ok:#1E8E3E;--bad:#C0392B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120B2B;--card:#1D1440;--ink:#EEEAFB;--mut:#B3A9D9;--line:#33295F;--ok:#4CC38A;--bad:#F08A7E;--ac:#B79CFF}}
:root[data-theme="dark"]{--bg:#120B2B;--card:#1D1440;--ink:#EEEAFB;--mut:#B3A9D9;--line:#33295F;--ok:#4CC38A;--bad:#F08A7E;--ac:#B79CFF}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pu);z-index:20}
h1,h2,h3,h4{font-family:Sora,system-ui,sans-serif;line-height:1.2;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--pu);color:#fff}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar b{font-family:Sora,sans-serif;font-size:1.15rem;display:block;line-height:1.1}
.bar small{color:var(--ye);font-weight:600}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;flex:none}
nav{background:var(--pu2)}
.nv{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
.nv a,.nv span{flex:none;padding:10px 14px;color:#fff;text-decoration:none;font-weight:600;font-size:.95rem}
.nv a.on{background:var(--ye);color:#1B1433;border-radius:8px 8px 0 0}.nv span{opacity:.55}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:1.35rem;margin:24px 0 12px}
p{margin:0 0 12px}.mut{color:var(--mut);margin:4px 0 0}
.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;background:var(--ye);color:#1B1433;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--pu2);color:#fff}
.hero{background:linear-gradient(135deg,#2A1270,#5B2DB8);color:#fff;border-radius:16px;padding:28px 20px;border-bottom:6px solid var(--gr)}
.hero h1{font-size:1.9rem}.hero h1 span{color:var(--ye)}.hero p{max-width:46ch;margin:10px 0 18px}
.hi{display:block;width:100%;max-width:440px;margin:18px auto 0;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.dom{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.dom svg{width:44px;height:44px;color:var(--ac)}.dom b{display:block;font-family:Sora,sans-serif;font-size:.95rem}.dom small{color:var(--mut);display:block;line-height:1.3}
.ck{list-style:none;margin:0;padding:0}.ck li{padding:4px 0 4px 28px;position:relative}.ck li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.prof img{width:72px;height:72px;border-radius:50%;flex:none}.prof span{color:var(--ok);font-weight:700}
.lay{display:grid;gap:16px}
@media(min-width:980px){.lay{grid-template-columns:220px minmax(0,1fr) 250px;align-items:start}}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side h3{background:var(--pu);color:#fff;padding:10px 14px}
.side a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-weight:600;font-size:.92rem;line-height:1.25}
.side a.on{background:var(--ye);color:#1B1433}.side svg{width:26px;height:26px;flex:none;color:var(--ac)}.side a.on svg{color:#1B1433}
.side small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}.side a.on small{color:#3b3320}
@media(max-width:979px){.side{display:flex;overflow-x:auto}.side h3{display:none}.side a{flex:none;border-bottom:0;border-right:1px solid var(--line)}}
.hero2{display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,#2A1270,#5B2DB8);color:#fff;border-radius:16px;padding:20px;border-bottom:6px solid var(--gr)}
@media(min-width:640px){.hero2{flex-direction:row;align-items:center}.hero2>div{flex:1}.hero2 img{width:46%}}
.hero2 h1{font-size:1.8rem;color:var(--ye)}.hero2 p{margin:8px 0 14px}.hero2 img{width:100%;border-radius:12px}
.two{display:grid;gap:12px;margin-top:14px}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.pnl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pnl>h3{background:var(--pu);color:#fff;padding:9px 14px;font-size:1rem}.pnl>div{padding:12px 14px}
.pnl .btn{display:block;text-align:center;margin-top:8px}
.rl{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:600}
.soon{color:var(--mut);font-weight:700}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}@media(min-width:640px){.chs{grid-template-columns:repeat(4,1fr)}}
.chc{font:inherit;text-align:center;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.chc.on{border-color:var(--ye)}.chc b{font-family:Sora,sans-serif;font-size:.95rem}.chc small{color:var(--mut);line-height:1.25;font-size:.78rem}
.chc img{height:64px;width:auto;border-radius:8px}.ci svg{width:56px;height:56px;color:var(--ac)}
.num{background:var(--pu2);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ye);border-radius:14px;padding:18px 16px;margin-bottom:12px}
.panel h3{margin-bottom:10px}.panel h4{margin:18px 0 8px;color:var(--ac)}.panel ul{padding-left:20px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.rv{font:inherit;font-weight:600;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:2px 12px;margin-top:6px;cursor:pointer}
.an{display:none;color:var(--ok);font-weight:600;margin:6px 0 0}.an.s{display:block}.an.bd{color:var(--bad)}
.opts{display:grid;gap:8px;margin-top:8px}.opt{font:inherit;text-align:left;padding:9px 14px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.cc>svg{flex:none;width:48px;height:48px;color:var(--ac)}.cc p{margin:2px 0 8px;color:var(--mut)}
.pb{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 10px}.pb i{display:block;height:100%;background:var(--gr)}
.back{color:var(--ac);font-weight:700;text-decoration:none}
.step{display:flex;gap:10px;margin:14px 0}.step .btn{flex:1;text-align:center}
.cert{border:3px double var(--ye);border-radius:14px;padding:18px;background:var(--card);text-align:center;margin-bottom:12px}
.cert h3{color:var(--ac)}input{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:6px 0 10px}
.tb{width:100%;border-collapse:collapse}.tb td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}.tb td:first-child{font-weight:700;white-space:nowrap}.pills{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.pill{flex:none;font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}.pill.on{background:var(--pu2);border-color:var(--pu2);color:#fff}details.panel summary{cursor:pointer}.ck2{display:block;padding:6px 0}input[type=checkbox]{width:auto;margin:0 8px 0 0;accent-color:var(--pu2)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}@media(min-width:640px){.gal{grid-template-columns:repeat(3,1fr)}}.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.fi{background:#EEF0FA;display:grid;place-items:center;padding:8px;min-height:96px}.fi svg{width:100%;max-width:130px;height:auto}.fi img{width:100%;max-width:170px;height:auto;border-radius:6px}.gal figcaption{padding:8px 10px;font-size:.85rem;line-height:1.3;color:var(--mut)}.gal figcaption b{color:var(--ink)}.gal figure.w{grid-column:1/-1}.fi img.big{max-width:420px}
footer{background:var(--pu);color:#fff;padding:18px 16px 24px;font-size:.92rem}footer div{max-width:1100px;margin:0 auto}footer em{color:var(--ye);font-weight:700}
.btn:focus-visible,.chc:focus-visible,a:focus-visible,.opt:focus-visible,.rv:focus-visible,.rl:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
</style>
</head>

var M={
histoire:{t:'Histoire de l’informatique',s:'Découvrez l’évolution fascinante des ordinateurs et de la technologie !',
obj:['Connaître l’histoire de l’informatique.','Comprendre les grandes étapes d’évolution.','Identifier les inventeurs et leurs apports.'],
sum:'L’informatique est née d’une idée simple : automatiser les calculs. De la première machine mécanique aux ordinateurs modernes, cette discipline a connu une évolution spectaculaire grâce à des inventeurs visionnaires et aux progrès technologiques.',
ch:[
{t:'Les origines',s:'Des premières idées aux machines mécaniques',img:'abacus',b:'<p>L’informatique est la science du traitement automatique de l’information à l’aide de machines électroniques.</p><ul><li><b>Antiquité</b> : le boulier</li><li><b>1642</b> : la Pascaline (Blaise Pascal)</li><li><b>1673</b> : la machine de Leibniz</li><li><b>1801</b> : le métier à tisser de Jacquard</li></ul>',ex:[['Qu’est-ce que l’informatique ?','La science du traitement automatique de l’information à l’aide de machines électroniques.'],['Qui a inventé la Pascaline ?','Blaise Pascal, en 1642.']]},
{t:'L’évolution',s:'Des années 1940 à nos jours',img:'pc',b:'<ul><li><b>1940–1950</b> : les grands ordinateurs</li><li><b>Années 1980</b> : les ordinateurs personnels</li><li><b>Années 1990</b> : les ordinateurs portables</li><li><b>Aujourd’hui</b> : des ordinateurs puissants et connectés</li></ul>',ex:[['Quelles machines remplissaient des salles entières ?','Les grands ordinateurs des années 1940–1950.'],['Quand sont apparus les ordinateurs personnels ?','Dans les années 1980.']]},
{t:'Les grandes dates',s:'Une chronologie incontournable',img:'cal',b:'<ul><li><b>1946</b> : ENIAC, le premier ordinateur électronique</li><li><b>1947</b> : le transistor, plus petit et moins gourmand en énergie</li><li><b>1958</b> : le circuit intégré, plus de composants sur une puce</li><li><b>1971</b> : le microprocesseur Intel 4004</li></ul>',ex:[['Que date de 1946 ?','L’ENIAC, premier ordinateur électronique.'],['Pourquoi le transistor est-il important ?','Il est plus petit et consomme moins d’énergie.'],['Qu’a permis le microprocesseur ?','Des ordinateurs plus petits.']]},
{t:'Les inventeurs',s:'Une galerie de génies',ic:'bulb',b:'<ul><li><b>Blaise Pascal</b> (1623–1662) : Pascaline, 1642</li><li><b>Gottfried Leibniz</b> (1646–1716) : machine à calculer, 1673</li><li><b>Charles Babbage</b> (1791–1871) : machine analytique, 1837</li><li><b>Ada Lovelace</b> (1815–1852) : premier programme, 1843</li><li><b>Herman Hollerith</b> (1860–1929) : cartes perforées, 1890</li></ul><p>Pionniers modernes : Steve Jobs (Apple), Bill Gates (Microsoft), Tim Berners-Lee (WWW), Linus Torvalds (Linux).</p>',ex:[['Qui a écrit le premier programme ?','Ada Lovelace, en 1843.'],['Citez deux pionniers modernes.','Par exemple Steve Jobs et Tim Berners-Lee.']]}]},
branches:{t:'Les branches de l’informatique',s:'Un vaste domaine, plusieurs spécialités.',obj:['Définir l’informatique, l’information et l’ordinateur.','Citer les principales branches de l’informatique.','Donner des exemples de logiciels et d’applications.'],sum:'L’informatique est la science du traitement automatique et rationnel de l’information. Elle se divise en plusieurs branches, du matériel à l’intelligence artificielle, chacune avec ses applications.',ch:[
{t:'Généralités',s:'Informatique, information, ordinateur',b:'<p>L’<b>informatique</b> est la science du traitement automatique et rationnel de l’information au moyen d’ordinateurs. Le mot vient de « information » et « automatique ».</p><p>Une <b>information</b> est une donnée qui a un sens pour celui qui la reçoit (une note, une date, un prix).</p><p>Un <b>ordinateur</b> est une machine électronique programmable qui reçoit des données, les traite, les stocke et produit des résultats.</p><ul><li>Entrée : réception des données</li><li>Traitement : transformation</li><li>Sortie : présentation des résultats</li><li>Stockage : conservation</li></ul>',ex:[['Définissez l’informatique.','La science du traitement automatique et rationnel de l’information au moyen d’ordinateurs.'],['Citez les quatre fonctions d’un ordinateur.','Entrée, traitement, sortie et stockage.']]},
{t:'Les branches',s:'Dix spécialités',b:'<ul><li><b>Fondamentale</b> : algorithmes, logique, numération</li><li><b>Matérielle (hardware)</b> : composants physiques</li><li><b>Logicielle (software)</b> : programmes et systèmes</li><li><b>De gestion</b> : élèves, notes, stocks, comptabilité</li><li><b>Industrielle</b> : automatisation des usines</li><li><b>Scientifique</b> : calculs complexes, météo, simulations</li><li><b>Médicale</b> : dossiers, imagerie</li><li><b>Réseaux</b> : Internet, partage de fichiers</li><li><b>Cybersécurité</b> : protéger les données</li><li><b>Intelligence artificielle</b> : reconnaissance vocale, traduction</li></ul>',ex:[['Citez cinq branches de l’informatique.','Par exemple : fondamentale, matérielle, logicielle, de gestion, cybersécurité.'],['Quel est le rôle de la cybersécurité ?','Protéger les ordinateurs, les réseaux et les informations contre les attaques et les accès non autorisés.']]},
{t:'Types de logiciels',s:'Système, application, programmation',b:'<ul><li><b>Logiciels système</b> : Windows, Linux, macOS, Android</li><li><b>Logiciels d’application</b> : Word, Excel, PowerPoint, Google Chrome, VLC</li><li><b>Logiciels de programmation</b> : Visual Studio Code, Python, JDK</li></ul><p>Exemple de gestion : une école utilise Excel pour calculer les moyennes des élèves.</p>',ex:[['Donnez trois logiciels d’application.','Par exemple Word, Excel et Google Chrome.'],['À quoi sert un logiciel de programmation ?','À créer et développer d’autres logiciels.']]},
{t:'Internet et recherche',s:'Naviguer sur le Web',b:'<ul><li><b>Réseau</b> : plusieurs ordinateurs reliés pour échanger des informations.</li><li><b>Internet</b> : réseau mondial qui relie les réseaux ; le <b>Web</b> (WWW) est l’ensemble des pages web.</li><li><b>Navigateur</b> : programme qui affiche les pages (Edge, Chrome, Firefox).</li><li><b>Moteur de recherche</b> : site pour chercher (Google, Bing).</li><li><b>URL</b> : l’adresse unique d’une page.</li><li><b>Favoris</b> : pages enregistrées pour les retrouver vite.</li></ul><p><b>Rechercher</b> : ouvrir le moteur de recherche, saisir des mots-clés précis, valider avec Entrée, puis choisir un site. Trop de résultats : ajouter des mots-clés.</p>',ex:[['Différence entre navigateur et moteur de recherche ?','Le navigateur affiche les pages web ; le moteur de recherche est un site qui aide à les trouver.'],['Que faire s’il y a trop de résultats ?','Ajouter des mots-clés pour préciser la recherche.']]},
{t:'Le courriel',s:'Écrire et recevoir des messages',b:'<ul><li><b>Boîte de réception</b> : les messages reçus (en gras = non lus).</li><li><b>Courrier indésirable</b> : messages douteux ; ne pas ouvrir ceux d’inconnus.</li><li><b>Brouillons</b>, <b>Éléments envoyés</b>, <b>Éléments supprimés</b>, <b>Archives</b>.</li></ul><p><b>Envoyer</b> : Nouveau, adresse du destinataire, objet, message, signature, Envoyer. Pour écrire à plusieurs personnes sans montrer leurs adresses, utiliser Cci. Une pièce jointe s’ajoute avec Joindre.</p><p>Se déconnecter avant de quitter, surtout sur un ordinateur partagé.</p>',ex:[['À quoi sert Cci ?','À envoyer à plusieurs personnes sans que leurs adresses soient visibles.'],['Que signifie un message en gras ?','Qu’il n’a pas encore été lu.']]}]},
avantages:{t:'Avantages et conséquences',s:'Mesurer l’impact de l’informatique dans la vie quotidienne.',obj:['Citer des domaines d’utilisation de l’informatique.','Identifier ses avantages.','Connaître les risques d’une mauvaise utilisation.'],sum:'L’informatique est présente à l’école, à l’hôpital, à la banque et dans le commerce. Elle fait gagner du temps, mais elle comporte aussi des risques qu’il faut connaître.',ch:[
{t:'Où l’utilise-t-on ?',s:'École, santé, banque, commerce',b:'<ul><li><b>Éducation</b> : préparation des cours, recherche, gestion des notes, apprentissage à distance</li><li><b>Médecine</b> : dossiers des patients, examens, gestion des pharmacies</li><li><b>Banques</b> : comptes, transferts d’argent, distributeurs automatiques</li><li><b>Commerce</b> : facturation, ventes, stocks, comptabilité</li></ul>',ex:[['Citez deux usages de l’informatique à l’école.','Par exemple la gestion des notes et la recherche documentaire.'],['Comment la banque utilise-t-elle l’informatique ?','Pour gérer les comptes, les transferts et les distributeurs automatiques.']]},
{t:'Les avantages',s:'Ce qu’elle apporte',b:'<ul><li>Gain de temps</li><li>Rapidité de traitement</li><li>Conservation des données</li><li>Communication à distance</li><li>Amélioration de la productivité</li><li>Accès à l’information</li></ul>',ex:[['Donnez trois avantages de l’informatique.','Par exemple le gain de temps, la rapidité de traitement et l’accès à l’information.']]},
{t:'Conséquences et risques',s:'Utiliser avec prudence',b:'<ul><li>Dépendance aux appareils</li><li>Piratage informatique et vol de données</li><li>Désinformation</li><li>Virus informatiques</li><li>Certaines suppressions d’emplois liées à l’automatisation</li><li>Problèmes de santé en cas d’usage prolongé</li></ul>',ex:[['Citez trois risques liés à une mauvaise utilisation.','Par exemple le piratage, les virus et la désinformation.']]},
{t:'Sécurité sur Internet',s:'Se protéger en ligne',b:'<ul><li>Vérifier l’information : préférer les sites officiels.</li><li>Achats : vérifier le « https » et ne donner sa carte bancaire que sur un site de confiance.</li><li>Mots de passe : différents pour chaque site, changés régulièrement, gardés en lieu sûr.</li><li>Antivirus à jour.</li><li>Hameçonnage et courriels douteux : ne pas cliquer.</li><li>Rumeurs : vérifier avant de transférer un message.</li><li>Ordinateur public : se déconnecter de tous ses comptes.</li><li>Réseaux sociaux : limiter ce que l’on publie et qui peut le voir.</li></ul>',ex:[['Comment reconnaître une connexion sécurisée ?','L’adresse commence par https.'],['Pourquoi ne pas utiliser le même mot de passe partout ?','Si un site est piraté, tous les comptes seraient en danger.']]}]},
hardware:{t:'Hardware',sub:'(composition matérielle)',s:'Découvrez les composants physiques de l’ordinateur.',
obj:['Définir le hardware.','Identifier les composants internes.','Distinguer les périphériques d’entrée et de sortie.'],
sum:'Le hardware est l’ensemble des composants physiques d’un ordinateur : processeur, mémoire, stockage, carte mère et périphériques.',
ch:[
{t:'Qu’est-ce que le hardware ?',s:'Le matériel',g:'hw1',b:'<p>Le hardware (ou matériel) est l’ensemble des composants physiques d’un ordinateur : ceux que l’on peut toucher.</p><p>Exemples : le processeur, la mémoire vive, le disque dur, l’écran, le clavier, la souris.</p>',ex:[['Le hardware, c’est quoi ?','Les composants physiques que l’on peut toucher.'],['Un clavier est-il du hardware ?','Oui : c’est un périphérique d’entrée.']]},
{t:'Les composants internes',s:'Dans l’unité centrale',g:'hw2',b:'<ul><li><b>Processeur (CPU)</b> : exécute les instructions, c’est le cerveau.</li><li><b>RAM</b> : mémoire de travail rapide, effacée à l’extinction.</li><li><b>Disque dur / SSD</b> : stockage permanent.</li><li><b>Carte mère</b> : relie tous les composants.</li><li><b>Carte graphique</b> : calcule l’image affichée.</li><li><b>Alimentation</b> : fournit le courant.</li><li><b>Refroidissement</b> : ventilateur et radiateur qui évacuent la chaleur.</li></ul>',ex:[['Quelle différence entre RAM et disque dur ?','La RAM est temporaire et rapide ; le disque garde les données même éteint.'],['Quel composant relie tous les autres ?','La carte mère.']]},
{t:'Les périphériques',s:'Entrée et sortie',g:'hw3',b:'<ul><li><b>Entrée</b> : clavier, souris, scanner, microphone, webcam.</li><li><b>Sortie</b> : écran, imprimante, haut-parleurs, casque.</li><li><b>Stockage</b> : disque dur externe, clé USB, cartes mémoires, graveur externe.</li><li><b>Communication</b> : clé Wi-Fi, clé Bluetooth, clé 3G/4G, modem.</li></ul>',ex:[['Donne trois périphériques d’entrée.','Clavier, souris, scanner (ou microphone, webcam).'],['L’imprimante est-elle d’entrée ou de sortie ?','De sortie.']]}]},
software:{t:'Software',sub:'(composition logicielle)',s:'Comprenez les programmes qui font vivre l’ordinateur.',
obj:['Définir le software.','Distinguer système, applications et utilitaires.','Comprendre le rôle des pilotes.'],
sum:'Le software regroupe les programmes qui font fonctionner l’ordinateur : système d’exploitation, applications, utilitaires et pilotes.',
ch:[
{t:'Qu’est-ce que le software ?',s:'Le logiciel',b:'<p>Le software (ou logiciel) est l’ensemble des programmes et instructions qui font fonctionner l’ordinateur. On ne peut pas le toucher.</p><p>Sans logiciel, le matériel ne fait rien ; sans matériel, le logiciel ne peut pas s’exécuter.</p>',ex:[['Le software, c’est quoi ?','Les programmes et instructions qui font fonctionner l’ordinateur.'],['Pourquoi a-t-on besoin des deux ?','Le matériel sans logiciel est inutile, et le logiciel a besoin du matériel pour s’exécuter.']]},
{t:'Le système d’exploitation',s:'Windows, Linux, Android…',b:'<p>Le système d’exploitation gère le matériel et les fichiers, et permet de lancer les applications.</p><p>Exemples : Windows, macOS, Linux, Android, iOS.</p>',ex:[['Quel est son rôle ?','Gérer le matériel et les fichiers, et lancer les applications.'],['Cite deux systèmes d’exploitation.','Par exemple Windows et Linux.']]},
{t:'Applications et pilotes',s:'Utilitaires inclus',b:'<ul><li><b>Applications</b> : traitement de texte, tableur, navigateur, jeux.</li><li><b>Utilitaires</b> : antivirus, compression, sauvegarde.</li><li><b>Pilotes</b> : permettent au système de dialoguer avec un périphérique.</li></ul>',ex:[['Un antivirus est-il une application ou un utilitaire ?','Un utilitaire.'],['À quoi sert un pilote ?','À faire communiquer le système avec un périphérique.']]}]},
windows:{t:'Windows',s:'Maîtrisez le système d’exploitation de Microsoft.',obj:['Définir Windows et son rôle.','Reconnaître le Bureau, le menu Démarrer et les fenêtres.','Gérer les fichiers et les dossiers.'],sum:'Windows est un système d’exploitation de Microsoft. Il permet de lancer des applications, d’organiser ses fichiers et de configurer l’ordinateur.',ch:[
{t:'Généralités',s:'Définition, versions, rôles',b:'<p>Windows est un système d’exploitation développé par Microsoft. Il permet à l’utilisateur de communiquer avec l’ordinateur et de gérer ses ressources.</p><p><b>Versions</b> : 95, 98, XP, Vista, 7, 8, 10 et 11.</p><ul><li>Démarrer et utiliser l’ordinateur</li><li>Gérer les fichiers et les dossiers</li><li>Installer et exécuter des logiciels</li><li>Gérer les périphériques et les paramètres</li><li>Sécuriser les données</li></ul>',ex:[['Quel est le rôle de Windows ?','Gérer les ressources de l’ordinateur et faciliter son utilisation.'],['Citez trois versions de Windows.','Par exemple Windows XP, 10 et 11.']]},
{t:'L’environnement',s:'Bureau, Démarrer, fenêtres',b:'<ul><li><b>Bureau</b> : espace principal avec icônes, raccourcis et barre des tâches</li><li><b>Icône</b> : petite image représentant un programme, un fichier ou un dossier</li><li><b>Menu Démarrer</b> : accès aux applications, paramètres et options d’alimentation</li><li><b>Barre des tâches</b> : applications ouvertes, zone de notification, date et heure</li></ul><p><b>Boutons d’une fenêtre</b> : Réduire, Agrandir, Restaurer, Fermer.</p>',ex:[['À quoi sert la barre des tâches ?','Elle affiche les applications ouvertes et donne un accès rapide aux programmes.'],['Que fait le bouton Restaurer ?','Il ramène la fenêtre à sa taille précédente.']]},
{t:'Fichiers et raccourcis',s:'Organiser son travail',b:'<p>Un <b>fichier</b> est un ensemble d’informations enregistré sous un nom (Cours.docx, Notes.xlsx). Un <b>dossier</b> sert à classer les fichiers.</p><p><b>Créer un dossier</b> : clic droit dans un espace vide, Nouveau, Dossier, saisir le nom, Entrée.</p><ul><li>Ctrl + C : copier, Ctrl + V : coller, Ctrl + X : couper</li><li>F2 : renommer, Suppr : supprimer (vers la Corbeille)</li><li>Ctrl + Z : annuler, Ctrl + A : tout sélectionner, Ctrl + S : enregistrer</li><li>Alt + Tab : changer de fenêtre, Windows + E : Explorateur, Windows + D : Bureau</li></ul><p>1 octet = 8 bits ; 1 Ko = 1 024 octets ; 1 Mo = 1 024 Ko.</p>',ex:[['Quelle touche permet de renommer un fichier ?','La touche F2.'],['TP : créez un dossier INFORMATIQUE_KS avec COURS, EXERCICES et DOCUMENTS.','Clic droit sur le Bureau, Nouveau, Dossier, nommer INFORMATIQUE_KS ; l’ouvrir et créer les trois sous-dossiers de la même façon.']]},
{t:'Souris et clavier',s:'Bien utiliser ses outils',b:'<ul><li><b>Bouton gauche</b> (le plus utilisé) : donner un ordre, cliquer, double-cliquer, glisser.</li><li><b>Bouton droit</b> : ouvre un menu contextuel.</li><li><b>Molette</b> : fait défiler la page ; Ctrl + molette = zoom.</li></ul><p><b>Formes du pointeur</b> : flèche (sélectionner), barre verticale (écrire), cercle barré (action interdite), rondelle (ordinateur occupé), petite main (lien), flèches en croix (déplacer).</p><p><b>Clavier</b> : Maj pour les majuscules et les symboles du haut d’une touche, Alt Gr pour les symboles à droite ou en bas, Entrée pour valider, Retour arrière et Suppr pour effacer. Pour un accent circonflexe ou un tréma, on tape d’abord le signe puis la lettre.</p>',ex:[['À quoi sert le bouton droit de la souris ?','À ouvrir un menu contextuel avec des options.'],['Que signifie la rondelle qui tourne ?','Que l’ordinateur est occupé : il faut attendre.']]},
{t:'Démarrer et arrêter',s:'Allumer, éteindre, bogues',b:'<p><b>Démarrer</b> : appuyer sur le bouton d’alimentation, puis attendre l’écran de connexion ou le Bureau.</p><p><b>Arrêter</b> : enregistrer son travail, fermer les programmes, puis Démarrer, Marche/Arrêt, Arrêter. Éviter d’éteindre avec le bouton du boîtier, sauf blocage.</p><p><b>Bogue (bug)</b> : l’ordinateur ne répond plus.</p><ul><li>Si la souris fonctionne : fermer le logiciel avec le X, sinon redémarrer par le menu Démarrer.</li><li>Si la souris ne répond plus : maintenir le bouton d’alimentation environ 5 secondes, puis rallumer.</li></ul><p>Le travail non enregistré est perdu : enregistrez régulièrement.</p>',ex:[['Comment éteindre correctement l’ordinateur ?','Enregistrer, fermer les programmes, puis Démarrer, Marche/Arrêt, Arrêter.'],['Que faire si la souris ne répond plus ?','Maintenir le bouton d’alimentation environ 5 secondes, puis rallumer.']]},
{t:'L’Explorateur de fichiers',s:'Classer et retrouver',b:'<p>L’<b>Explorateur de fichiers</b> montre le contenu de l’ordinateur : c’est la salle des classeurs.</p><ul><li><b>Volet gauche</b> : l’arborescence des dossiers (les flèches affichent ou masquent les sous-dossiers).</li><li><b>Volet droit</b> : le contenu du dossier sélectionné.</li><li><b>Nouveau dossier</b> : onglet Accueil, Nouveau dossier, saisir le nom, Entrée.</li><li><b>Déplacer</b> : glisser le fichier sur le dossier voulu.</li><li><b>Sélectionner plusieurs fichiers</b> : Maj pour une suite, Ctrl pour des fichiers dispersés.</li><li><b>Rechercher</b> : écrire un mot-clé dans la zone de recherche en haut à droite.</li></ul>',ex:[['Comment sélectionner des fichiers qui se suivent ?','Cliquer sur le premier, maintenir Maj, cliquer sur le dernier.'],['Comment retrouver un fichier égaré ?','Choisir un dossier dans l’Explorateur et écrire un mot-clé dans la zone de recherche.']]},
{t:'Clé USB et sauvegarde',s:'Protéger ses fichiers',b:'<ul><li><b>Clé USB</b> : se branche sur un port USB et apparaît dans le volet gauche. Avant de la retirer, l’éjecter (icône de la zone de notification ou clic droit, Éjecter).</li><li><b>Corbeille</b> : un fichier supprimé y va d’abord. Pour le récupérer : ouvrir la Corbeille, clic droit, Restaurer. Pour libérer de l’espace : Vider la corbeille.</li><li><b>Copie de sécurité</b> : copier ses dossiers importants sur une clé USB ou un disque externe, au moins une fois par mois, et la ranger loin de l’ordinateur.</li></ul>',ex:[['Pourquoi éjecter une clé USB avant de la retirer ?','Pour éviter de perdre des données.'],['À quoi sert une copie de sécurité ?','À retrouver ses fichiers si l’ordinateur tombe en panne, est volé ou détruit.']]},
{t:'Personnaliser et paramètres',s:'Fond d’écran, raccourcis, réglages',b:'<ul><li><b>Arrière-plan</b> : clic droit sur le Bureau, Personnaliser, choisir une image.</li><li><b>Écran de veille</b> : Personnaliser, Écran de verrouillage, Paramètres de l’écran de veille, choisir le type et le délai, Appliquer, OK.</li><li><b>Raccourci</b> : depuis le menu Démarrer, glisser l’icône de l’application vers le Bureau ou la barre des tâches. Pour le retirer : clic droit, supprimer ou détacher.</li><li><b>Paramètres</b> (menu Démarrer) : Système, Périphériques, Réseau et Internet, Personnalisation, Comptes, Heure et langue, Mise à jour et sécurité.</li></ul>',ex:[['Comment changer l’image du Bureau ?','Clic droit sur le Bureau, Personnaliser, puis choisir une image.'],['Où gère-t-on les comptes utilisateurs ?','Dans Paramètres, section Comptes.']]}]},
word:{t:'Microsoft Word',s:'Créez et mettez en forme vos documents.',obj:['Définir Word et reconnaître son interface.','Mettre en forme du texte et des paragraphes.','Insérer un tableau, une image, un en-tête et enregistrer.'],sum:'Microsoft Word est un logiciel de traitement de texte. Il sert à créer lettres, rapports, CV et exposés, puis à les enregistrer et les imprimer.',ch:[
{t:'Présentation',s:'Définition et interface',b:'<p>Word permet de créer, modifier, mettre en forme, enregistrer et imprimer des documents : lettres, rapports, CV, cours, exposés, mémoires, tableaux.</p><ul><li><b>Barre de titre</b> : nom du document</li><li><b>Barre d’accès rapide</b> : Enregistrer, Annuler, Rétablir</li><li><b>Ruban</b> : onglets et commandes</li><li><b>Règle</b> : marges, retraits, tabulations</li><li><b>Zone de travail</b> : saisie du texte</li><li><b>Barre d’état</b> : pages et mots</li></ul>',ex:[['Que permet de faire Word ?','Créer, modifier, mettre en forme, enregistrer et imprimer des documents.'],['À quoi sert le ruban ?','Il regroupe les onglets et les commandes de Word.']]},
{t:'L’onglet Accueil',s:'Police, paragraphe, styles',b:'<ul><li><b>Presse-papiers</b> : coller, couper, copier, reproduire la mise en forme</li><li><b>Police</b> : type, taille, gras, italique, souligné, couleur, surlignage</li><li><b>Paragraphe</b> : alignement, puces, numérotation, interligne, bordures</li><li><b>Styles</b> : Titre 1, Titre 2, Normal</li></ul><p><b>Quatre alignements</b> : à gauche, centré, à droite, justifié.</p><p>Raccourcis : Ctrl + B (gras), Ctrl + I (italique), Ctrl + U (souligné), Ctrl + E (centrer), Ctrl + J (justifier).</p>',ex:[['Citez les quatre alignements.','À gauche, centré, à droite, justifié.'],['Quel raccourci met le texte en gras ?','Ctrl + B.']]},
{t:'Insertion et mise en page',s:'Tableaux, images, enregistrement',b:'<p><b>Tableau</b> : Insertion, Tableau, choisir lignes et colonnes, remplir les cellules.</p><p><b>Image</b> : Insertion, Images, sélectionner, Insérer.</p><p>Un <b>en-tête</b> est en haut de la page, un <b>pied de page</b> en bas (nom de l’école, date, numéro de page).</p><ul><li>Mise en forme : apparence du texte</li><li>Mise en page : marges, orientation (portrait ou paysage), taille du papier (A4, A3)</li></ul><p><b>Enregistrer</b> : Fichier, Enregistrer sous. Formats : DOCX, DOC, PDF, RTF, TXT.</p>',ex:[['Différence entre mise en forme et mise en page ?','La mise en forme concerne l’apparence du texte ; la mise en page, l’organisation de la page (marges, orientation).'],['Quel est le format courant de Word ?','DOCX.']]},
{t:'Premiers pas de saisie',s:'Saisir, copier, illustrer, imprimer',b:'<ul><li>La touche <b>Entrée</b> crée un nouveau paragraphe (un titre est aussi un paragraphe) ; la barre d’espace insère un seul espace entre deux mots.</li><li><b>Copier-coller</b> : sélectionner, Copier (Ctrl + C), placer le curseur, Coller (Ctrl + V).</li><li><b>Insérer une image</b> : placer le curseur, Insertion, Image ; clic droit sur l’image, Habillage du texte, Rapproché pour la déplacer.</li><li><b>Imprimer</b> : Fichier, Imprimer ; l’aperçu avant impression montre le résultat ; vérifier le nombre de copies et les pages.</li></ul><p>Enregistrer sous un autre nom conserve le document d’origine.</p>',ex:[['À quoi sert l’aperçu avant impression ?','À vérifier le document tel qu’il sera imprimé.'],['Que fait la touche Entrée dans Word ?','Elle commence un nouveau paragraphe.']]},
{t:'La suite bureautique',s:'Word, Excel, PowerPoint, Outlook',b:'<p>La <b>bureautique</b> regroupe les logiciels qui aident à produire des documents de travail. <b>Microsoft Office</b> en est la suite la plus connue.</p><ul><li><b>Word</b> : traitement de texte (lettres, CV, rapports, mémoires).</li><li><b>Excel</b> : tableur (tableaux, calculs automatiques, graphiques).</li><li><b>PowerPoint</b> : présentations en diapositives.</li><li><b>Outlook</b> : courriels, contacts, agenda et tâches.</li><li>Autres : Access (bases de données), OneNote (notes), Project (suivi de projet).</li></ul><p>Office existe aussi en ligne dans le navigateur (version plus légère). Les alternatives sont <b>OpenOffice</b> (libre et gratuit) et <b>iWork</b> (Pages, Keynote, Numbers, pour Mac). Les logiciels des suites se ressemblent et sont compatibles entre eux : un graphique Excel peut être collé dans Word.</p>',ex:[['Quel logiciel Office sert à faire des calculs ?','Excel, le tableur.'],['Citez une suite bureautique libre et gratuite.','OpenOffice.']]},
{t:'La fenêtre et l’affichage',s:'Ruban, règle, modes d’affichage',b:'<ul><li><b>Barre de titre</b> : nom du document. <b>Menu Fichier</b> : ouvrir, enregistrer, imprimer.</li><li><b>Accès rapide</b> : les actions courantes. <b>Ruban</b> : onglets regroupant les outils.</li><li><b>Onglets</b> : Accueil (police, paragraphe, styles), Insertion (tableaux, images), Création, Mise en page, Références (table des matières, notes), Publipostage, Révision (orthographe), Affichage.</li><li><b>Règle</b> : marges, retraits, tabulations. <b>Barre d’état</b> : pages, mots, langue, zoom.</li></ul><p><b>Modes d’affichage</b> : Page (le texte comme à l’impression, à utiliser pour la mise en forme), Lecture (plein écran), Web, Plan (pour structurer un long document), Brouillon. Le <b>zoom</b> agrandit ou réduit l’affichage sans changer le document.</p>',ex:[['Quel mode utiliser pour la mise en forme ?','Le mode Page.'],['Dans quel onglet trouve-t-on la table des matières ?','Dans Références.']]},
{t:'Sélection et mise en forme',s:'Police, alignement, tabulations',b:'<p><b>Sélectionner</b> : double-clic sur un mot ; clic dans la marge gauche pour une ligne ; double-clic dans la marge pour un paragraphe ; trois clics dans la marge pour tout le texte. Avec Maj on étend une sélection continue, avec Ctrl on ajoute des parties séparées.</p><ul><li><b>Police</b> : type, taille, gras, italique, souligné, couleur.</li><li><b>Alignements</b> : gauche, centré, droite, justifié.</li><li><b>Retraits</b> et <b>interligne</b> : espace à gauche et entre les lignes ou paragraphes.</li><li><b>Tabulations</b> : la touche Tab saute au repère suivant (tous les 1,25 cm par défaut). Pour aligner des colonnes, on emploie des tabulations, jamais des espaces.</li></ul>',ex:[['Comment sélectionner tout le texte avec la souris ?','Trois clics dans la marge gauche.'],['Pourquoi préférer les tabulations aux espaces ?','Elles alignent correctement les informations, y compris à l’impression.']]},
{t:'Saisie et caractères masqués',s:'Bien taper son texte',b:'<p><b>Règles de saisie</b> : taper au fil de la plume (Word gère les retours à la ligne), appuyer sur Entrée seulement pour changer de paragraphe, respecter majuscules et ponctuation, ne pas laisser de lignes vides, et faire la mise en forme une fois la saisie terminée.</p><p><b>Autres façons de saisir</b> : numériser un document papier avec un scanner et un logiciel d’OCR (reconnaissance de caractères), puis relire attentivement ; ou dicter le texte grâce à la reconnaissance vocale.</p><ul><li><b>Caractères masqués</b> (bouton ¶) : paragraphe, tabulation, espace, fin de ligne (Maj + Entrée), espace insécable (Ctrl + Maj + Espace). Ils ne s’impriment pas.</li><li><b>Saut de page</b> : Ctrl + Entrée. Un saut de section permet de changer l’orientation ou la bordure d’une partie du document.</li><li><b>Compter les mots</b> : indiqué dans la barre d’état, détails dans l’onglet Révision.</li></ul>',ex:[['Que signifie OCR ?','Reconnaissance optique de caractères : elle transforme un texte numérisé en texte modifiable.'],['Quel raccourci insère un saut de page ?','Ctrl + Entrée.']]},
{t:'Insérer des éléments',s:'Listes, bordures, tableaux, images',b:'<ul><li><b>Puces et numéros</b> : sélectionner les paragraphes, onglet Accueil.</li><li><b>Bordures</b> : de page (onglet Création) ou de texte (paragraphe ou texte sélectionné).</li><li><b>Rechercher et remplacer</b> : onglet Accueil, pour changer un mot partout.</li><li><b>Tableau</b> : onglet Insertion, Tableau ; des onglets d’outils apparaissent quand le tableau est sélectionné.</li><li><b>Image</b> : Insertion, Image ; un onglet Format apparaît pour la taille et l’habillage.</li><li><b>SmartArt</b> : schémas prêts à remplir. <b>QuickPart</b> : conserver un bloc de texte réutilisable.</li><li><b>Date et heure</b>, <b>symboles et caractères spéciaux</b> : onglet Insertion.</li></ul>',ex:[['Où trouve-t-on Rechercher et remplacer ?','Dans l’onglet Accueil.'],['À quoi sert un SmartArt ?','À créer rapidement un schéma ou une illustration structurée.']]},
{t:'Mise en page et document long',s:'Du brouillon au PDF',b:'<ul><li><b>Mise en page</b> : taille du papier (A4…), orientation (portrait ou paysage) et marges.</li><li><b>En-tête et pied de page</b> : onglet Insertion ; avec des sections, on peut les rendre différents en désactivant « Lier au précédent ».</li><li><b>Numéros de page</b> : Insertion, Numéro de page.</li><li><b>Note de bas de page</b> : onglet Références, pour une explication ou une source.</li><li><b>Table des matières</b> : appliquer les styles Titre 1, Titre 2, Titre 3, puis insérer la table ; après modification, Mettre à jour la table.</li><li><b>Page de garde</b> : couverture toute prête.</li><li><b>Imprimer</b> : Fichier, Imprimer (vérifier l’aperçu).</li><li><b>PDF</b> : Fichier, Enregistrer sous, type PDF. <b>Mot de passe</b> : Fichier, Informations, Protéger le document.</li></ul>',ex:[['Que faut-il faire pour créer une table des matières ?','Appliquer les styles Titre 1, Titre 2, Titre 3 aux titres, puis insérer la table.'],['Comment transformer un document Word en PDF ?','Fichier, Enregistrer sous, puis choisir le type PDF.']]}]},
excel:{t:'Microsoft Excel',s:'Calculez, analysez et présentez vos données.',obj:['Reconnaître classeur, feuille, colonne, ligne et cellule.','Utiliser formules et fonctions de base.','Construire un bulletin de notes et un graphique.'],sum:'Microsoft Excel est un tableur. Il permet de saisir des données, de faire des calculs automatiques avec des formules et de créer des graphiques.',ch:[
{t:'Généralités',s:'Interface et données',b:'<p>Excel sert à calculer des moyennes, gérer des notes, faire des budgets, des factures et des statistiques.</p><ul><li><b>Classeur</b> : un fichier Excel</li><li><b>Feuille de calcul</b> : une page du classeur</li><li><b>Colonnes</b> : A, B, C… ; <b>lignes</b> : 1, 2, 3…</li><li><b>Cellule</b> : intersection d’une ligne et d’une colonne (A1, B5)</li><li><b>Barre de formule</b> et <b>zone de nom</b></li></ul><p>Une formule commence par le signe =, par exemple =A1+B1.</p>',ex:[['Qu’est-ce qu’une cellule ?','L’intersection d’une ligne et d’une colonne, par exemple B5.'],['Par quoi commence une formule ?','Par le signe égal (=).']]},
{t:'Formules et fonctions',s:'Calculer automatiquement',b:'<ul><li>Opérations : + - * / ^ (puissance)</li><li><b>=SOMME(A1:A5)</b> : additionne</li><li><b>=MOYENNE(B2:B6)</b> : moyenne</li><li><b>=MAX(B2:B10)</b> et <b>=MIN(B2:B10)</b> : plus grande et plus petite valeur</li><li><b>=NB(A1:A10)</b> : compte les nombres ; <b>=NBVAL(A1:A10)</b> : cellules non vides</li><li><b>=SI(A1>=10;"Admis";"Échoué")</b> : test logique</li></ul><p>Exemple : si A1 = 20 et B1 = 10, alors =A1+B1 donne 30, =A1-B1 donne 10, =A1*B1 donne 200 et =A1/B1 donne 2.</p>',ex:[['Que fait =SOMME(A1:A5) ?','Elle additionne les valeurs des cellules A1 à A5.'],['Expliquez =SI(A1>=10;"Admis";"Échoué").','Si A1 est supérieur ou égal à 10, Excel affiche Admis, sinon Échoué.']]},
{t:'Bulletin et graphiques',s:'Un cas pratique',b:'<p>Tableau : N°, Nom, Français, Maths, Informatique, Moyenne, Décision.</p><ul><li>Moyenne en F2 : <b>=MOYENNE(C2:E2)</b>, puis recopier vers le bas avec la poignée de recopie</li><li>Décision : <b>=SI(F2>=10;"Admis";"Échoué")</b></li><li>Meilleure moyenne : <b>=MAX(F2:F5)</b>, plus faible : <b>=MIN(F2:F5)</b></li><li>Moyenne générale : <b>=MOYENNE(F2:F5)</b></li></ul><p><b>Graphique</b> : sélectionner les cellules, Insertion, Graphiques, choisir le type (colonnes, barres, circulaire, courbes), ajouter un titre.</p>',ex:[['Comment calculer la meilleure moyenne ?','Avec =MAX(F2:F5).'],['Quel graphique montre des proportions ?','Le graphique circulaire.']]},
{t:'Classeur et feuilles',s:'Cellules, plages, sélection',b:'<p>Un fichier Excel est un <b>classeur</b> qui contient des <b>feuilles</b> de calcul. Une feuille compte 16 384 colonnes et plus d’un million de lignes.</p><ul><li><b>Renommer</b> une feuille : double-clic sur son onglet, saisir le nom, Entrée.</li><li><b>Ajouter</b> : bouton + à côté des onglets. <b>Supprimer</b> : clic droit sur l’onglet, Supprimer.</li><li><b>Déplacer</b> : glisser l’onglet. <b>Copier vers un autre classeur</b> : clic droit, Déplacer ou copier, cocher Créer une copie.</li><li><b>Cellule</b> : intersection d’une colonne et d’une ligne, nommée par sa colonne puis sa ligne (B5).</li><li><b>Plage</b> : groupe de cellules voisines, noté de la première à la dernière (B2:D10).</li><li><b>Sélection multiple</b> : maintenir Ctrl pour ajouter des plages séparées.</li></ul>',ex:[['Comment renommer une feuille ?','Double-clic sur son onglet, saisir le nouveau nom, puis Entrée.'],['Comment note-t-on la plage de B2 à D10 ?','B2:D10.']]},
{t:'Saisie et recopie',s:'Gagner du temps',b:'<ul><li><b>Saisir</b> au fil de la plume, sans mise en forme ; Entrée valide et descend d’une cellule. La mise en forme se fait ensuite.</li><li><b>Poignée de recopie</b> (petit carré en bas à droite de la cellule) : la glisser recopie le contenu.</li><li><b>Recopie incrémentée</b> : avec lundi, une date ou deux nombres consécutifs, la poignée continue la liste (mardi, mercredi…).</li><li><b>Remplacer</b> le contenu : sélectionner la cellule et retaper. <b>Corriger</b> une faute : cliquer dans la barre de formule, modifier, Entrée.</li></ul>',ex:[['À quoi sert la poignée de recopie ?','À recopier une cellule ou à prolonger une liste (jours, dates, nombres).'],['Comment corriger une faute sans tout retaper ?','En modifiant le contenu dans la barre de formule.']]},
{t:'Mise en forme des données',s:'Un tableau lisible',b:'<ul><li><b>Police</b>, <b>couleur de remplissage</b> et <b>bordures</b> (le quadrillage affiché ne s’imprime pas : il faut ajouter des bordures).</li><li><b>Alignement</b> : le texte se place à gauche, les nombres à droite ; on peut changer et <b>fusionner</b> des cellules pour un titre.</li><li><b>Formats</b> : nombres, dates (courte, longue ou personnalisée).</li><li><b>Lignes et colonnes</b> : Insérer, Supprimer ; largeur et hauteur à la souris, un double-clic sur la séparation ajuste au contenu.</li><li><b>Effacer</b> : Suppr efface le contenu ; l’outil Effacer permet de retirer seulement les formats ou tout.</li></ul>',ex:[['Le quadrillage de la feuille s’imprime-t-il ?','Non : il faut ajouter des bordures.'],['Comment ajuster une colonne à son contenu ?','Double-clic sur la séparation, dans l’en-tête de colonne.']]},
{t:'Mise en page et impression',s:'Avant d’imprimer',b:'<ul><li><b>Aperçu avant impression</b> : indispensable pour vérifier le résultat et le nombre de pages.</li><li><b>Orientation</b> : portrait ou paysage. <b>Échelle</b> : réduire ou ajuster un grand tableau à la page.</li><li><b>Marges</b> : éviter de les mettre à zéro, l’imprimante exige un minimum. <b>Centrage</b> horizontal et vertical possible.</li><li><b>En-tête et pied de page</b> : prédéfinis ou personnalisés ; on peut écrire Page &[Page] sur &[Pages] pour « Page 1 sur 2 ».</li><li><b>Zone d’impression</b> : limiter l’impression à une partie de la feuille. <b>Impression des titres</b> : répéter des lignes ou colonnes sur chaque page.</li><li><b>Imprimer</b> : choisir les pages, le nombre de copies, la sélection, les feuilles actives ou tout le classeur.</li></ul>',ex:[['Pourquoi consulter l’aperçu avant impression ?','Pour vérifier l’aspect final et le nombre de pages avant d’imprimer.'],['À quoi sert la zone d’impression ?','À n’imprimer qu’une partie choisie de la feuille.']]},
{t:'Formules et références',s:'Calculs automatiques',b:'<p>Une <b>formule</b> commence par = et ne contient pas d’espaces : =A2+B2-C2. Opérateurs : + - * / ^. Excel calcule d’abord les parenthèses, puis multiplications et divisions, puis additions et soustractions : 2*3+4 = 10, mais 2*(3+4) = 14.</p><ul><li><b>Fonction</b> : =NOM(argument1;argument2). Ex. =MOYENNE(A1:A3) équivaut à =(A1+A2+A3)/3.</li><li><b>Somme automatique</b> : bouton Σ (ou Alt + =) ; elle propose aussi moyenne, max et min.</li><li><b>SI imbriqué</b> : =SI(B10>15;"Excellent";SI(B10<9;"Médiocre";"Bien")).</li><li><b>Référence relative</b> : quand on recopie une formule, les cellules citées se décalent. <b>Référence absolue</b> : avec $ (=B6*$C$2, touche F4), la cellule reste fixe.</li><li><b>Nommer une cellule</b> : écrire un nom sans espace dans la zone Nom (ex. Taux_remise) ; elle devient absolue.</li></ul>',ex:[['Que donne =2*(3+4) ?','14.'],['Pourquoi utiliser une référence absolue ($C$2) ?','Pour que la cellule (par exemple un taux) ne bouge pas quand on recopie la formule.']]},
{t:'Les graphiques',s:'Illustrer ses données',b:'<p>Un graphique se crée à partir d’un tableau.</p><ul><li>Sélectionner les données sans les totaux et sans ligne ou colonne vide (elles seraient lues comme des zéros).</li><li>Onglet Insertion, groupe Graphiques, choisir par exemple Colonne.</li><li><b>Mettre en forme</b> : Disposition rapide, Styles de graphique, modifier le titre, le quadrillage et la légende (clic droit).</li><li><b>Déplacer</b> en glissant, <b>redimensionner</b> avec les carrés de la bordure, <b>supprimer</b> avec Suppr.</li><li><b>Ajouter une série</b> : copier la colonne puis coller sur le graphique, ou utiliser Sélectionner des données.</li></ul>',ex:[['Pourquoi éviter les totaux dans un graphique ?','Ils créent une échelle trop grande et ghênent la lecture.'],['Comment ajouter une nouvelle colonne de données au graphique ?','La copier puis la coller sur le graphique, ou utiliser Sélectionner des données.']]}]}

M.powerpoint={t:'Microsoft PowerPoint',s:'Créez des présentations claires et dynamiques.',obj:['Découvrir les modes d’affichage et les espaces réservés.','Insérer texte, images, graphiques, tableaux et médias.','Lancer un diaporama avec transitions et animations.'],sum:'PowerPoint est un logiciel de présentation : on y construit des diapositives (texte, images, graphiques, sons, vidéos) projetées pour appuyer un exposé oral.',ch:[
{t:'Prise en main',s:'Affichages et espaces réservés',b:'<ul><li><b>Modes d’affichage</b> : Normal (travail), Trieuse de diapositives (vue d’ensemble) et Diaporama (projection).</li><li><b>Volet de gauche</b> : miniatures des diapositives ou plan du texte.</li><li><b>Nouvelle diapositive</b> : on choisit une disposition selon le contenu (titre, texte, image, tableau, graphique).</li><li><b>Espaces réservés</b> : zones prévues pour le titre, le sous-titre, le texte, les images ; on clique dedans pour écrire. Une <b>zone de texte</b> peut aussi être ajoutée librement.</li><li><b>Notes</b> : sous la diapositive, pour préparer ce que l’on dira (non projetées).</li></ul>',ex:[['Citez les trois modes d’affichage principaux.','Normal, Trieuse de diapositives et Diaporama.'],['À quoi servent les espaces réservés ?','À recevoir le titre, le texte, les images ou les graphiques de la diapositive.']]},
{t:'Insérer du contenu',s:'Texte, images, tableaux, médias',b:'<ul><li><b>Texte</b> : préférer des listes à puces courtes, sur plusieurs niveaux.</li><li><b>Lien hypertexte</b> : clic droit sur le texte ou l’objet, Lien.</li><li><b>Image</b> : Insertion, Images ; un onglet de mise en forme apparaît quand elle est sélectionnée.</li><li><b>Graphique</b> : Insertion, Graphique ; les données se saisissent dans une feuille de calcul (on peut les reprendre d’Excel).</li><li><b>Tableau</b> : Insertion, Tableau, puis mise en forme comme dans Word.</li><li><b>SmartArt</b> : organigramme, liste ou schéma prêt à remplir.</li><li><b>Son et vidéo</b> : depuis l’ordinateur ou en ligne ; régler le lancement (au clic ou automatique).</li></ul>',ex:[['Pourquoi privilégier les listes à puces ?','Elles résument les idées en phrases courtes, faciles à lire de loin.'],['Comment créer un lien hypertexte ?','Clic droit sur le texte ou l’objet, puis Lien.']]},
{t:'Diaporama et trieuse',s:'Présenter et organiser',b:'<ul><li><b>F5</b> : lance le diaporama depuis la première diapositive ; <b>Maj + F5</b> : depuis la diapositive active.</li><li>Pendant la projection : flèches, barre d’espace ou clic pour avancer ; <b>B</b> : écran noir ; <b>W</b> : écran blanc ; clic droit : options du pointeur (surligneur, effacer les annotations) ; <b>Échap</b> : quitter.</li><li><b>Trieuse</b> : glisser une diapositive pour la déplacer ; glisser avec Ctrl pour la dupliquer ; clic droit, Masquer la diapositive pour ne pas la projeter (on peut y revenir par clic droit, Aller à).</li></ul>',ex:[['Quelle touche lance le diaporama depuis le début ?','F5.'],['Comment dupliquer une diapositive dans la trieuse ?','La glisser en maintenant Ctrl.']]},
{t:'Transitions et animations',s:'Donner du rythme',b:'<ul><li><b>Transition</b> : effet entre deux diapositives (onglet Transitions) ; garder le même style pour rester sobre.</li><li><b>Minutage</b> : enregistrer la durée de chaque diapositive pour un défilement automatique.</li><li><b>Animation</b> : effet appliqué à un objet ou un texte (onglet Animations). Trois types : <b>entrée</b> (apparition), <b>emphase</b> (mise en valeur), <b>sortie</b> (disparition).</li><li>On peut animer un SmartArt ou un graphique par élément, et régler le déclenchement et la durée dans les options d’effet.</li></ul><p>Conseil : peu d’effets, au service du message.</p>',ex:[['Quels sont les trois types d’animation ?','Entrée, emphase et sortie.'],['Pourquoi limiter les animations ?','Trop d’effets distraient le public du message.']]},
{t:'Masques et mode présentateur',s:'Harmoniser et présenter',b:'<ul><li><b>Masque des diapositives</b> (Affichage, Masque des diapositives) : on règle une seule fois la police, la taille, les couleurs, les puces, les logos, les en-têtes et pieds de page de toute la présentation. Il peut être enregistré comme modèle.</li><li><b>Mode présentateur</b> : l’ordinateur affiche la diapositive, les notes et la suivante, pendant que le vidéoprojecteur montre seulement la diapositive au public.</li></ul>',ex:[['À quoi sert le masque des diapositives ?','À appliquer la même mise en forme à toute la présentation.'],['Que voit le public en mode présentateur ?','Seulement la diapositive projetée, sans les notes.']]},
{t:'Enregistrer et partager',s:'Formats et bonnes pratiques',b:'<ul><li><b>.pptx</b> : format normal ; <b>.ppt</b> : anciennes versions.</li><li><b>.ppsx</b> : diaporama qui s’ouvre directement en projection (lecture seule).</li><li><b>PDF</b>, <b>JPG</b> (une image par diapositive) ou <b>vidéo</b> pour partager.</li><li><b>Mot de passe</b> : Enregistrer sous, Outils, Options générales, pour empêcher la modification.</li></ul><p><b>Bonnes pratiques</b> : une idée par diapositive, peu de texte, police lisible, couleurs bien contrastées, images de qualité. Et répéter l’exposé avant de le présenter.</p>',ex:[['Quel format s’ouvre directement en diaporama ?','Le format .ppsx.'],['Citez deux bonnes pratiques de présentation.','Par exemple une idée par diapositive et peu de texte.']]}]};

document.getElementById("ksSignup").addEventListener("submit", async function(e) {
  e.preventDefault();

  const fullName = document.getElementById("ksName").value.trim();
  const email = document.getElementById("ksEmail").value.trim();
  const password = document.getElementById("ksPassword").value;

  msg.textContent = "Création du compte en cours...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { full_name: fullName }
    }
  });

  if (error) {
    msg.textContent = "Erreur : " + error.message;
    return;
  }

  msg.textContent = data.session
    ? "Compte créé avec succès !"
    : "Compte créé. Vérifiez votre boîte e-mail pour confirmer votre adresse.";
});

// 
// Connexion
document.getElementById("ksLogin").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("ksLoginEmail").value.trim();
  const password = document.getElementById("ksLoginPassword").value;

  msg.textContent = "Connexion en cours...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    msg.textContent = "Erreur : " + error.message;
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("full_name, role")
    .eq("id", data.user.id)
    .single();

  if (profileError) {
    msg.textContent = "Connexion réussie, mais profil introuvable.";
    return;
  }

  authBox.innerHTML = `
    <h2 style="color:#7040a0">Bienvenue ${profile.full_name.replace(/[&<>"']/g, "")} !</h2>
    <p>Votre espace KS INFORMATIQUE est ouvert.</p>
    <p>Votre rôle : <strong>${profile.role}</strong></p>
    <button id="ksLogout" type="button">Déconnexion</button>
  `;

  document.getElementById("ksLogout").addEventListener("click", async function() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert("Erreur : " + error.message);
      return;
    }

    location.reload();
  });
});
