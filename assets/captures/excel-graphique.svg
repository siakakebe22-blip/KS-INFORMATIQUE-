<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t"><title id="t">Créer un graphique en colonnes dans Excel</title><defs><style>text{font-family:Arial,sans-serif;fill:#26364a}.head{font-size:28px;font-weight:bold;fill:#fff}.label{font-size:20px;font-weight:bold}.small{font-size:16px}.tiny{font-size:14px}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.green{fill:#e7f5eb;stroke:#16834a;stroke-width:3}.blue{fill:#eaf3ff;stroke:#2673ad;stroke-width:3}.orange{fill:#fff2df;stroke:#c77716;stroke-width:3}</style></defs><rect width="1200" height="650" rx="22" fill="#f2f7fb"/><rect width="1200" height="65" rx="20" fill="#176b43"/><text x="32" y="44" class="head">Transformer les données en graphique</text><rect x="90" y="110" width="1020" height="460" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="155" text-anchor="middle" class="label">Moyenne des élèves sur 20</text><g stroke="#d7e0e8" stroke-width="2"><path d="M200 220H1010M200 290H1010M200 360H1010M200 430H1010M200 500H1010"/></g><g class="small" text-anchor="end"><text x="180" y="225">20</text><text x="180" y="295">15</text><text x="180" y="365">10</text><text x="180" y="435">5</text><text x="180" y="505">0</text></g><g><rect x="290" y="290" width="105" height="210" fill="#2d8a59"/><rect x="465" y="360" width="105" height="140" fill="#4a9dca"/><rect x="640" y="255" width="105" height="245" fill="#2d8a59"/><rect x="815" y="325" width="105" height="175" fill="#4a9dca"/></g><g class="small" text-anchor="middle"><text x="342" y="535">Aminata</text><text x="517" y="535">Mamadou</text><text x="692" y="535">Fatou</text><text x="867" y="535">Ibrahima</text><text x="342" y="275">15</text><text x="517" y="345">10</text><text x="692" y="240">17,5</text><text x="867" y="310">12,5</text></g><text x="600" y="610" text-anchor="middle" class="small">Sélectionner les noms et les moyennes, puis choisir Insertion → Graphique en colonnes.</text></svg>