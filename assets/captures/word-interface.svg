<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Interface de Microsoft Word</title><desc id="d">Reconstitution pédagogique de l’interface Word montrant la barre de titre, les onglets, le ruban, la règle, la page, la barre d’état et le zoom.</desc><defs><linearGradient id="blue" x2="0" y2="1"><stop stop-color="#2874bd"/><stop offset="1" stop-color="#14508f"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#253247}.small{font-size:15px}.label{font-size:19px;font-weight:bold}.call{stroke:#d94841;stroke-width:3;fill:none}.tab{font-size:17px;fill:white}.tool{font-size:14px;fill:#344054}</style></defs><rect width="1200" height="690" rx="22" fill="#eef2f7"/><rect x="0" y="0" width="1200" height="52" rx="18" fill="url(#blue)"/><text x="24" y="34" font-size="21" font-weight="bold" fill="white">W  Document1 — Microsoft Word</text><text x="1140" y="32" font-size="18" fill="white">— □ ×</text><rect x="0" y="52" width="1200" height="42" fill="#f8fafc"/><text x="24" y="79" class="tool">Enregistrer　↶　↷</text><g><rect x="190" y="52" width="82" height="42" fill="#fff"/><text x="208" y="79" font-size="17" font-weight="bold">Accueil</text><text x="295" y="79" class="tool">Insertion</text><text x="390" y="79" class="tool">Disposition</text><text x="510" y="79" class="tool">Références</text><text x="620" y="79" class="tool">Révision</text><text x="720" y="79" class="tool">Affichage</text></g><rect x="0" y="94" width="1200" height="135" fill="#fff" stroke="#cbd5e1"/><g class="tool"><rect x="18" y="108" width="75" height="88" rx="7" fill="#f1f5f9" stroke="#d5dce5"/><text x="32" y="145">Coller</text><text x="28" y="174">Couper</text><text x="112" y="126">Police</text><rect x="110" y="137" width="150" height="30" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="122" y="158">Arial　 12 ▾</text><text x="285" y="126">Paragraphe</text><rect x="282" y="137" width="190" height="54" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="300" y="160">≡　☷　•　↔</text><text x="498" y="126">Styles</text><rect x="495" y="137" width="310" height="54" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="512" y="160">Normal　Titre 1　Titre 2</text><text x="850" y="126">Modification</text><rect x="845" y="137" width="160" height="54" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="864" y="160">Rechercher</text><text x="864" y="181">Remplacer</text></g><rect x="0" y="229" width="1200" height="420" fill="#dfe5ec"/><rect x="175" y="255" width="850" height="350" rx="3" fill="#fff" stroke="#b8c2cf"/><rect x="175" y="238" width="850" height="17" fill="#f8fafc"/><path d="M175 247 H1025 M200 247 V255" stroke="#8a98aa" stroke-width="2"/><text x="600" y="355" text-anchor="middle" font-size="32" font-weight="bold" fill="#1d4f91">Mon premier document</text><text x="600" y="395" text-anchor="middle" font-size="19" fill="#526174">Zone de saisie : cliquez ici pour écrire votre texte.</text><rect x="0" y="649" width="1200" height="41" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="675" class="small">Page 1 sur 1　　0 mot</text><text x="880" y="675" class="small">Mode Page　　Zoom　−　100 %　＋</text><path class="call" d="M220 94 L220 44"/><text x="28" y="28" class="label" fill="#d94841">Barre de titre</text><path class="call" d="M570 95 L570 115"/><text x="520" y="250" class="label" fill="#d94841">Ruban et onglets</text><path class="call" d="M1050 420 L1025 420"/><text x="1058" y="414" class="label" fill="#d94841">Page</text><path class="call" d="M600 650 L600 630"/><text x="615" y="640" class="label" fill="#d94841">Barre d’état</text></svg>