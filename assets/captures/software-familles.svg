<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="t"><title id="t">Familles de logiciels</title><defs><style>text{font-family:Arial,sans-serif;fill:#26364a}.title{font-size:28px;font-weight:bold;fill:white}.name{font-size:21px;font-weight:bold}.desc{font-size:16px;fill:#536276}.card{fill:#fff;stroke:#d8e1eb;stroke-width:2}</style></defs><rect width="1100" height="570" rx="22" fill="#f3f7fb"/><rect width="1100" height="74" rx="22" fill="#c76b18"/><text x="35" y="49" class="title">SOFTWARE — les logiciels qui font fonctionner l’ordinateur</text><g transform="translate(35 110)"><g><rect class="card" width="490" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#e8f1ff"/><text x="58" y="70" text-anchor="middle" font-size="39" font-weight="bold" fill="#2563a6">W</text><text x="120" y="48" class="name">Système d’exploitation</text><text x="120" y="78" class="desc">Gère le matériel et lance les applications.</text><text x="120" y="100" class="desc">Exemple : Windows.</text></g><g transform="translate(510)"><rect class="card" width="520" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#e8f7ef"/><text x="58" y="70" text-anchor="middle" font-size="39" font-weight="bold" fill="#18824e">W</text><text x="120" y="48" class="name">Traitement de texte</text><text x="120" y="78" class="desc">Sert à rédiger et mettre en forme des documents.</text><text x="120" y="100" class="desc">Exemple : Microsoft Word.</text></g><g transform="translate(0 135)"><rect class="card" width="490" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#e7f2ff"/><text x="58" y="70" text-anchor="middle" font-size="39" font-weight="bold" fill="#1873b9">X</text><text x="120" y="48" class="name">Tableur</text><text x="120" y="78" class="desc">Organise les données et réalise des calculs.</text><text x="120" y="100" class="desc">Exemple : Microsoft Excel.</text></g><g transform="translate(510 135)"><rect class="card" width="520" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#f1eaff"/><text x="58" y="70" text-anchor="middle" font-size="39" font-weight="bold" fill="#7142a6">P</text><text x="120" y="48" class="name">Présentation</text><text x="120" y="78" class="desc">Permet de créer des diapositives pour exposer.</text><text x="120" y="100" class="desc">Exemple : PowerPoint.</text></g><g transform="translate(0 270)"><rect class="card" width="490" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#fff3e8"/><text x="58" y="70" text-anchor="middle" font-size="39" font-weight="bold" fill="#d97706">🌐</text><text x="120" y="48" class="name">Navigateur Web</text><text x="120" y="78" class="desc">Permet de consulter des sites Internet.</text><text x="120" y="100" class="desc">Exemples : Chrome, Firefox, Edge.</text></g><g transform="translate(510 270)"><rect class="card" width="520" height="115" rx="15"/><rect x="22" y="22" width="72" height="72" rx="14" fill="#e8f7ef"/><text x="58" y="70" text-anchor="middle" font-size="38" font-weight="bold" fill="#16834e">✓</text><text x="120" y="48" class="name">Outils de sécurité</text><text x="120" y="78" class="desc">Aident à détecter certaines menaces.</text><text x="120" y="100" class="desc">Exemple : Microsoft Defender.</text></g></g><text x="550" y="540" text-anchor="middle" font-size="19" font-weight="bold" fill="#a95c15">Le software = les programmes que l’on utilise, sans pouvoir les toucher.</text></svg>