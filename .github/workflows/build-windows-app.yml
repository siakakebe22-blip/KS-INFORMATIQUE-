name: Build KS INFORMATIQUE Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-app.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KS-INFORMATIQUE-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
