<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t"><title id="t">Trier et filtrer les données dans Excel</title><defs><style>text{font-family:Arial,sans-serif;fill:#26364a}.head{font-size:28px;font-weight:bold;fill:#fff}.label{font-size:20px;font-weight:bold}.small{font-size:16px}.tiny{font-size:14px}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.green{fill:#e7f5eb;stroke:#16834a;stroke-width:3}.blue{fill:#eaf3ff;stroke:#2673ad;stroke-width:3}.orange{fill:#fff2df;stroke:#c77716;stroke-width:3}</style></defs><rect width="1200" height="650" rx="22" fill="#f2f7fb"/><rect width="1200" height="65" rx="20" fill="#176b43"/><text x="32" y="44" class="head">Trier et filtrer un tableau</text><text x="65" y="125" class="label">Tableau de résultats — exemple</text><rect x="65" y="150" width="1070" height="310" class="card"/><rect x="65" y="150" width="1070" height="55" fill="#e5efe9"/><g class="small" text-anchor="middle"><text x="190" y="184">Élève</text><text x="430" y="184">Classe</text><text x="680" y="184">Moyenne</text><text x="950" y="184">Décision</text><text x="190" y="245">Aminata</text><text x="430" y="245">10e</text><text x="680" y="245">15</text><text x="950" y="245">Admis</text><text x="190" y="305">Mamadou</text><text x="430" y="305">10e</text><text x="680" y="305">8</text><text x="950" y="305">À revoir</text><text x="190" y="365">Fatou</text><text x="430" y="365">10e</text><text x="680" y="365">17</text><text x="950" y="365">Admis</text><text x="190" y="425">Ibrahima</text><text x="430" y="425">10e</text><text x="680" y="425">12</text><text x="950" y="425">Admis</text></g><g stroke="#cbd5e1" stroke-width="2"><path d="M65 205H1135M65 265H1135M65 325H1135M65 385H1135M65 460H1135M315 150V460M545 150V460M820 150V460"/></g><rect x="65" y="490" width="500" height="100" rx="12" class="blue"/><text x="90" y="530" class="label">TRI</text><text x="90" y="560" class="small">Classe les moyennes du plus grand au plus petit.</text><rect x="590" y="490" width="545" height="100" rx="12" class="orange"/><text x="615" y="530" class="label">FILTRE</text><text x="615" y="560" class="small">Affiche uniquement les moyennes ≥ 10, sans supprimer les autres.</text></svg>